#! The shared pnpm resource only watches pnpm-lock.yaml. Keep the dependency
#! bundle in sync with every file that affects pnpm's install result.
#@ def pnpm_deps_resource():
name: deps
type: git
source:
  paths: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, patches/*]
  uri: #@ data.values.git_uri
  branch: #@ data.values.git_branch
  private_key: #@ data.values.github_private_key
#@ end

groups:
- name: terminal
  jobs:
    - audit
    - install-deps
    - check-code
    - build-edge-image
    - release
    - bump-image-in-chart

jobs:
- #@ install_nodejs_deps(pckgMgr = "pnpm")
- #@ nodejs_audit()
- #@ nodejs_check_code()
- #@ build_edge_image()
- #@ release()
- #@ open_charts_pr()

resources:
- #@ repo_resource(webhook=True)
- #@ pipeline_tasks_resource()
- #@ edge_image_resource()
- #@ pnpm_deps_resource()
- #@ deps_version_resource()
- #@ bundled_deps_resource()
- #@ slack_resource()

- #@ version_resource()
- #@ charts_repo_resource()
- #@ versioned_image_resource()

- #@ gh_release_resource()
- #@ charts_repo_bot_branch()

resource_types:
- #@ gcr_resource_type()
- #@ slack_resource_type()

